# graphify 0.9.111, the code knowledge-graph tool behind the Claude Code
# graphify skill: PyPI's graphifyy (github.com/Graphify-Labs/graphify) and
# the 30 wheels uv resolved for it on this machine on 2026-11-16 (networkx,
# numpy, PyYAML, RapidFuzz, tree-sitter and 25 grammars), each the cp313 or
# abi3 manylinux x86_64 wheel, in a venv of its own on astral/python 3.13.
# The sha256 of each is PyPI's (pypi.org/pypi/<project>/<version>/json),
# read on 2026-11-17. Patched at build: its cache files follow
# GRAPHIFY_CACHE_HOME, then ~/AppData/pypi.graphifyy/cache, then
# XDG_CACHE_HOME, then ~/.cache; a user-scope codex skill goes to
# CODEX_HOME; its Claude skill finds this graphify before uv's.
# Apache-2.0; the wheels BSD-3-Clause, MIT, Apache-2.0, and in numpy's
# 0BSD, Zlib, CC0-1.0, BSD-3-Clause-Open-MPI and libgfortran's
# GPL-3.0-or-later WITH GCC-exception-3.1. Fetched from
# files.pythonhosted.org, never mirrored.

