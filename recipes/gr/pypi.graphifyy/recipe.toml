[[dependencies]]
name         = "python"
organization = "astral"
track        = "3.13.*"

[provides]
command = ["graphify", "graphify-mcp"]
env     = ["GRAPHIFY_CACHE_HOME=AppData/pypi.graphifyy/cache"]

[build]
prepare = '''
python3 -I - <<'PY'
import pathlib
import re
import sys


def sub(path, old, new, count=1):
    p = pathlib.Path(path)
    text = p.read_text(encoding="utf-8")
    found = text.count(old)
    if found != count:
        sys.exit(f"{path}: {found} of {old!r}, {count} expected: upstream changed, the patch is stale")
    p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")


sub("graphify/paths.py",
    "\n\ndef out_path(*parts: str) -> Path:\n",
    "\n\ndef cache_home() -> Path:\n"
    "    value = os.environ.get(\"GRAPHIFY_CACHE_HOME\", \"\")\n"
    "    if os.path.isabs(value):\n"
    "        return Path(value)\n"
    "    appdata = Path.home() / \"AppData\"\n"
    "    if appdata.is_dir():\n"
    "        return appdata / \"pypi.graphifyy\" / \"cache\"\n"
    "    value = os.environ.get(\"XDG_CACHE_HOME\", \"\")\n"
    "    if os.path.isabs(value):\n"
    "        return Path(value)\n"
    "    return Path.home() / \".cache\"\n"
    "\n\ndef out_path(*parts: str) -> Path:\n")

sub("graphify/install.py",
    "from graphify.paths import GRAPHIFY_OUT as _GRAPHIFY_OUT\n",
    "from graphify.paths import GRAPHIFY_OUT as _GRAPHIFY_OUT\n"
    "from graphify.paths import cache_home as _cache_home\n")
sub("graphify/install.py",
    "    return Path.home() / \".cache\" / \"graphify\" / \"skill-locks\" / f\"{digest}.lock\"\n",
    "    return _cache_home() / \"graphify\" / \"skill-locks\" / f\"{digest}.lock\"\n")

sub("graphify/install.py",
    "        return Path(os.environ[\"CLAUDE_CONFIG_DIR\"]) / \"skills\" / \"graphify\" / \"SKILL.md\"\n"
    "    return Path.home() / cfg[\"skill_dst\"]\n",
    "        return Path(os.environ[\"CLAUDE_CONFIG_DIR\"]) / \"skills\" / \"graphify\" / \"SKILL.md\"\n"
    "    if platform_name == \"codex\" and os.environ.get(\"CODEX_HOME\"):\n"
    "        return Path(os.environ[\"CODEX_HOME\"]) / \"skills\" / \"graphify\" / \"SKILL.md\"\n"
    "    return Path.home() / cfg[\"skill_dst\"]\n")

sub("graphify/querylog.py",
    "from typing import Any\n",
    "from typing import Any\n\nfrom graphify.paths import cache_home\n")
sub("graphify/querylog.py",
    "        return Path.home() / \".cache\" / \"graphify-queries.log\"\n",
    "        return cache_home() / \"graphify-queries.log\"\n")

sub("graphify/hooks.py",
    "_log = os.environ.get('GRAPHIFY_REBUILD_LOG') or os.path.join(os.path.expanduser('~'), '.cache', 'graphify-rebuild.log')\n",
    "_home = os.path.expanduser('~')\n"
    "_app = os.path.join(_home, 'AppData', 'pypi.graphifyy', 'cache') if os.path.isdir(os.path.join(_home, 'AppData')) else ''\n"
    "_dirs = [os.environ.get('GRAPHIFY_CACHE_HOME') or '', _app, os.environ.get('XDG_CACHE_HOME') or '']\n"
    "_cache = next((d for d in _dirs if os.path.isabs(d)), os.path.join(_home, '.cache'))\n"
    "_log = os.environ.get('GRAPHIFY_REBUILD_LOG') or os.path.join(_cache, 'graphify-rebuild.log')\n")
sub("graphify/hooks.py",
    "_GRAPHIFY_LOG=\"${HOME}/.cache/graphify-rebuild.log\"\n",
    "_GFY_CACHE=\"${HOME}/.cache\"\n"
    "case \"${XDG_CACHE_HOME:-}\" in /*) _GFY_CACHE=\"$XDG_CACHE_HOME\" ;; esac\n"
    "[ -d \"${HOME}/AppData\" ] && _GFY_CACHE=\"${HOME}/AppData/pypi.graphifyy/cache\"\n"
    "case \"${GRAPHIFY_CACHE_HOME:-}\" in /*) _GFY_CACHE=\"$GRAPHIFY_CACHE_HOME\" ;; esac\n"
    "_GRAPHIFY_LOG=\"$_GFY_CACHE/graphify-rebuild.log\"\n", 4)

uv = (
    "# 1. uv tool installs — most reliable on modern Mac/Linux\n"
    "if [ -z \"$PYTHON\" ] && command -v uv >/dev/null 2>&1; then\n"
    "    _UV_PY=$(uv tool run --from graphifyy python -c \"import sys; print(sys.executable)\" 2>/dev/null)\n"
    "    if [ -n \"$_UV_PY\" ]; then PYTHON=\"$_UV_PY\"; fi\n"
    "fi\n")
shebang = (
    "# 2. Read shebang from graphify binary (pipx and direct pip installs)\n"
    "if [ -z \"$PYTHON\" ] && [ -n \"$GRAPHIFY_BIN\" ]; then\n"
    "    _SHEBANG=$(head -1 \"$GRAPHIFY_BIN\" | tr -d '#!')\n"
    "    case \"$_SHEBANG\" in\n"
    "        *[!a-zA-Z0-9/_.@-]*) ;;\n"
    "        *) \"$_SHEBANG\" -c \"import graphify\" 2>/dev/null && PYTHON=\"$_SHEBANG\" ;;\n"
    "    esac\n"
    "fi\n")
sub("graphify/skill.md", uv + shebang,
    shebang.replace("# 2. Read shebang from graphify binary (pipx and direct pip installs)",
                    "# 1. Read shebang from the graphify on PATH (apm, pipx and direct pip installs)")
    + "case \"${_SHEBANG:-}\" in\n"
    "    /opt/apm/packages/pypi/graphifyy/*)\n"
    "        [ -n \"$PYTHON\" ] || { echo \"graphify: the apm package pypi/graphifyy cannot import graphify with $_SHEBANG (astral/python moved to a new minor?): it needs a rebuild. Not falling back to uv.\" >&2; exit 1; } ;;\n"
    "esac\n"
    + uv.replace("# 1. uv tool installs", "# 2. uv tool installs"))

home_cache = re.compile(r"home\(\) / \"\.cache\"|expanduser\('~'\), '\.cache'|_home, '\.cache'|HOME\}?/\.cache")
hits = {}
for f in sorted(pathlib.Path("graphify").rglob("*.py")):
    n = len(home_cache.findall(f.read_text(encoding="utf-8")))
    if n:
        hits[str(f)] = n
if hits != {"graphify/hooks.py": 5, "graphify/paths.py": 1}:
    sys.exit(f"a home cache path outside the patch: {hits}")
PY
'''
install = '''
D=$APM_DESTDIR$APM_PREFIX
PY=/opt/apm/packages/astral/python/current/bin/python3
V=$D/venv
SP=$V/lib/python3.13/site-packages
test "$($PY -c 'import sys; print(sys.version_info[:2] == (3, 13))')" = True
install -d $SP $V/bin $D/bin
printf 'home = /opt/apm/packages/astral/python/current/bin\ninclude-system-site-packages = false\nversion = 3.13\n' > $V/pyvenv.cfg
printf '#!/bin/bash\nexec -a "$0" %s "$@"\n' $PY > $V/bin/python3
chmod 755 $V/bin/python3
cp -a $APM_SRC/. $SP/
for n in $(seq 2 31); do
	eval "s=\$APM_SOURCE_$n"
	cp -a $s/. $SP/
done
entry() {
	cat > $D/bin/$1 <<EOF
#!/opt/apm/packages/pypi/graphifyy/current/venv/bin/python3
import os
import sys

if sys.version_info[:2] != (3, 13):
    sys.exit("$1: pypi/graphifyy is built for Python 3.13, astral/python is " + sys.version.split()[0] + ": it needs a rebuild")
home = os.path.expanduser("~")
os.environ.setdefault("CLAUDE_CONFIG_DIR", os.path.join(home, "AppData", "anthropic.claude-code"))
os.environ.setdefault("CODEX_HOME", os.path.join(home, "AppData", "openai.codex"))
from $2 import $3
sys.exit($3())
EOF
	chmod 755 $D/bin/$1
}
entry graphify graphify.__main__ main
entry graphify-mcp graphify.serve _main
$PY -I -m compileall -q -j 0 --invalidation-mode checked-hash -s $APM_DESTDIR -p / $SP
$PY -I - $SP <<'PY'
import importlib.metadata as md
import os
import re
import sys
import tempfile
from pathlib import Path

from pip._vendor.packaging.requirements import Requirement

sp = sys.argv[1]
sys.path.insert(0, sp)
dists = {re.sub(r"[-_.]+", "-", d.metadata["Name"]).lower(): d for d in md.distributions(path=[sp])}
if len(dists) != 31:
    sys.exit(f"{len(dists)} wheels in site-packages, 31 expected")
for line in dists["graphifyy"].requires:
    r = Requirement(line)
    if r.marker and not r.marker.evaluate({"extra": ""}):
        continue
    d = dists.get(re.sub(r"[-_.]+", "-", r.name).lower())
    if d is None or not r.specifier.contains(d.version, prereleases=True):
        sys.exit(f"graphifyy wants {line}; the recipe has {d.version if d else 'none'}")

import graphify.__main__
import graphify.extract
import graphify.serve
from graphify.paths import cache_home

home = Path(tempfile.mkdtemp())
os.environ["HOME"] = str(home)
for k in ("GRAPHIFY_CACHE_HOME", "XDG_CACHE_HOME"):
    os.environ.pop(k, None)
assert cache_home() == home / ".cache"
os.environ["XDG_CACHE_HOME"] = "relative"
assert cache_home() == home / ".cache"
os.environ["XDG_CACHE_HOME"] = "/x"
assert cache_home() == Path("/x")
(home / "AppData").mkdir()
assert cache_home() == home / "AppData" / "pypi.graphifyy" / "cache"
os.environ["GRAPHIFY_CACHE_HOME"] = "/g"
assert cache_home() == Path("/g")
PY
'''
