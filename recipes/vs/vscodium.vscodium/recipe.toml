# VSCodium, from the VSCodium project's own GitHub release: the linux x64
# tarball, unpacked as it is, with one wrapper, bin/codium, which runs
# the editor through the GTK3 runtime with Electron on Wayland -- the VS
# Code recipe over again, for the build without Microsoft's telemetry and
# licence. Its extensions come from Open VSX.
#
# The version is VSCodium's 1.135.06055 (VS Code 1.135 and VSCodium's
# own build number) written 1.135.6055, since a part here has no leading
# zero. The sha256 is the one in VSCodium's .sha256 file beside the
# tarball, checked against the file as downloaded on 2026-10-09.
#
# MIT (VSCodium's build of Code - OSS). Fetched from GitHub, never
# mirrored. The Chromium sandbox works through user namespaces on AOS, so
# chrome-sandbox needs no setuid bit and --no-sandbox is not passed.

recipe_version = 1

[package]
name         = "vscodium"
organization = "vscodium"
version      = "1.140.6880"
release      = 1
kind         = "app"
summary      = "VSCodium, VS Code without Microsoft's telemetry"
license      = "MIT"
homepage     = "https://vscodium.com/"
# Needs the sandbox's tools field (round 38/39); an older apm holds it.
min_aos      = "0.3.10"

[[source]]
url    = "https://github.com/VSCodium/vscodium/releases/download/1.140.06880/VSCodium-linux-x64-1.140.06880.tar.gz"
sha256 = "61223b74f9e40834117311ec4177cb386d09b84c1aae4f9e674c96580569cef3"

[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[provides]
command = ["codium"]

# An editor opens the person's projects wherever they are: the whole
# home, as for VS Code.
[sandbox]
home = "full"
# The installed command-line tools (node, java, dotnet, python, cargo),
# read-only: an editor without them is an editor without a terminal
# (the G14, 0.3.8: inside VS Code python3 was the OS's stripped build).
tools = true

[launcher]
name       = "VSCodium"
comment    = "Code editing, without telemetry"
exec       = "bin/codium"
icon       = "vscodium/resources/app/resources/linux/code.png"
categories = ["Development", "IDE"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/vscodium $D/bin
cp -a $APM_SRC/. $D/vscodium/
# --password-store=gnome-libsecret: as for VS Code and Chrome.
# The Electron binary itself, not the tarball's bin/codium: that is the
# command-line client, which starts the editor detached and exits at
# once, and aos-sandbox's pid namespace dies with its first process,
# taking the editor with it -- the launcher did nothing at all.
cat > $D/bin/codium <<WRAP
#!/bin/sh
# VSCodium on the GTK3 runtime, on Wayland.
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/vscodium/codium --ozone-platform=wayland --password-store=gnome-libsecret "\$@"
WRAP
chmod 755 $D/bin/codium
'''
