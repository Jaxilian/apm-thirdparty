# The HTML, CSS and JSON language servers of VS Code, as the npm package
# vscode-langservers-extracted publishes them, for editors that start
# them by name. The package and the 32 packages it depends on are each a
# tarball from the npm registry, unpacked into lib/node_modules where
# Node looks for them: nothing is installed by npm, and the build needs no
# network. The versions are the ones `npm install --package-lock-only
# vscode-langservers-extracted@4.10.0` (npm 11, Node 26.13.0) resolved on
# 2026-11-12; the list below is that lock file's, in its order.
#
# No update.toml: a newer release needs the lock resolved again, which
# the weekly bump cannot do.
#
# The sha256 of each is of the file as downloaded on 2026-11-12, after it
# matched the sha512 integrity the registry's lock entry carries. MIT;
# the dependencies are MIT, BSD-2-Clause (css-select and the dom
# packages), ISC (semver, boolbase) and Apache-2.0 (typescript). Fetched
# from registry.npmjs.org, never mirrored.

recipe_version = 1

[package]
name         = "vscode-langservers"
organization = "npm"
version      = "4.10.0"
release      = 1
kind         = "bin"
summary      = "Language servers for HTML, CSS and JSON"
license      = "MIT"
homepage     = "https://github.com/hrsh7th/vscode-langservers-extracted"

