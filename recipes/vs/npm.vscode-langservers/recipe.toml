[[dependencies]]
name         = "node"
organization = "nodejs"
track        = "*"

[provides]
command = ["vscode-html-language-server", "vscode-css-language-server", "vscode-json-language-server"]

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
M=$D/lib/node_modules
install -d $D/bin $M/vscode-langservers-extracted
cp -a $APM_SOURCE_1/. $M/vscode-langservers-extracted/
while read n path; do
	eval "s=\$APM_SOURCE_$n"
	install -d $M/vscode-langservers-extracted/node_modules/$path
	cp -a $s/. $M/vscode-langservers-extracted/node_modules/$path/
done <<LIST
2 @vscode/l10n
3 boolbase
4 core-js
5 css-select
6 css-what
7 dom-serializer
8 domelementtype
9 domhandler
10 domutils
11 entities
12 he
13 jsonc-parser
14 node-html-parser
15 nth-check
16 picomatch
17 regenerator-runtime
18 request-light
19 semver
20 typescript
21 vscode-css-languageservice
22 vscode-css-languageservice/node_modules/vscode-languageserver-types
23 vscode-html-languageservice
24 vscode-json-languageservice
25 vscode-jsonrpc
26 vscode-languageserver
27 vscode-languageserver-protocol
28 vscode-languageserver-protocol/node_modules/vscode-languageserver-types
29 vscode-languageserver-textdocument
30 vscode-languageserver-types
31 vscode-markdown-languageservice
32 vscode-nls
33 vscode-uri
LIST
for n in html css json; do
	cat > $D/bin/vscode-$n-language-server <<WRAP
#!/bin/sh
exec node $APM_PREFIX/lib/node_modules/vscode-langservers-extracted/bin/vscode-$n-language-server "\$@"
WRAP
	chmod 755 $D/bin/vscode-$n-language-server
done
'''
