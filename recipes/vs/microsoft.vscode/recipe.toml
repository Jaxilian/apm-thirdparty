# Visual Studio Code, from Microsoft's own download: a vendor binary. The
# recipe unpacks it and writes one wrapper, bin/vscode, which runs the
# editor through the GTK3 runtime's gtk3-run with Electron told to use
# Wayland. Nothing in the tarball is modified. The URL carries the
# build's hash, so it is stable, and Microsoft's update API publishes the
# checksum, so a version bump is a text edit.
#
# Proprietary: Microsoft Software License Terms. Fetched from Microsoft,
# never mirrored. The Chromium sandbox works through user namespaces on
# AOS, so chrome-sandbox needs no setuid bit and --no-sandbox is not passed.

recipe_version = 1

[package]
name         = "vscode"
organization = "microsoft"
version      = "1.145.2"
release      = 3
kind         = "app"
summary      = "Visual Studio Code"
license      = "LicenseRef-Microsoft-Software-License-Terms"
homepage     = "https://code.visualstudio.com/"
# Needs AOS 0.4.12's aos-sandbox (the home in ~/AppData, `:ro` shares,
# --ssh, --no-flatpak-info); an older one would not know them.
min_aos      = "0.4.75"

[[source]]
url    = "https://vscode.download.prss.microsoft.com/dbazure/download/stable/c4453f8ea430795f941c1b2ff6c9321135a74a02/code-stable-x64-1793945155.tar.gz"
sha256 = "3b01286639fa026fd860944b811d418f7b93bc5dc447d9e607b0cd1377cfbaa2"
strip  = 1

[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[provides]
command = ["vscode"]

# Its own folder, ~/AppData/<org>.<name>, is its home: settings,
# extensions and caches stay there. It sees ~/Projects read-write (where
# repositories live; Open Folder on anything else asks once and restarts
# it into the folder) and ~/.gitconfig read-only, plus the SSH keys
# (read-only, the agent's socket) for git over ssh and the installed
# command-line tools (node, java, dotnet, python, cargo), without which an
# editor has no terminal (the G14, 0.3.8).
[sandbox]
home = "private"
# ~/.claude and ~/.claude.json: Claude Code's sign-in and settings, the
# same ones the Terminal's claude uses (without them VS Code's Claude
# signed out, 2026-10-23). A hidden folder may be shared read-write since
# AOS 0.4.13 / apm v0.1.27, hence min_aos.
share = ["Projects", ".gitconfig:ro", ".claude", ".claude.json"]
data  = ["anthropic/claude-code", "openai/codex", "xai/grok", "google/antigravity"]
tools = true
ssh   = true

[launcher]
name       = "Visual Studio Code"
comment    = "Code editing, redefined"
exec       = "bin/vscode %F"
icon       = "vscode/resources/app/resources/linux/code.png"
categories = ["Development", "IDE"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/vscode $D/bin
cp -a $APM_SRC/. $D/vscode/
# The Microsoft-authentication extension's native MSAL runtime wants
# WebKitGTK and libsoup, which AOS has not; the extension works without
# it (apm check refused VSCodium's bump on it, 2026-11-02).
rm -f $D/vscode/resources/app/extensions/microsoft-authentication/dist/libmsalruntime.so $D/vscode/resources/app/extensions/microsoft-authentication/dist/msal-node-runtime.node
# --password-store=gnome-libsecret: Chromium picks its keyring by the
# desktop's name and knows none of ours, so without it stored logins are
# kept in the clear; AOS 0.3.3 has the Secret Service (oo7) and libsecret
# in the core, reachable from the sandbox through the session bus.
# The Electron binary itself, not the tarball's bin/code: that is the
# command-line client, which starts the editor detached and exits at
# once, and aos-sandbox's pid namespace dies with its first process,
# taking the editor with it -- the launcher did nothing at all.
cat > $D/bin/vscode <<WRAP
#!/bin/sh
# Visual Studio Code on the GTK3 runtime, on Wayland. An assistant's
# packaged folder is used when the person allowed it (it is then a
# mount of its own), else the home's own .claude as before.
used() { grep -q " \$1 " /proc/self/mountinfo 2>/dev/null; }
used "\$HOME/AppData/anthropic.claude-code" && export CLAUDE_CONFIG_DIR="\$HOME/AppData/anthropic.claude-code"
used "\$HOME/AppData/openai.codex" && export CODEX_HOME="\$HOME/AppData/openai.codex"
used "\$HOME/AppData/xai.grok" && export GROK_HOME="\$HOME/AppData/xai.grok"
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/vscode/code --ozone-platform=wayland --password-store=gnome-libsecret "\$@"
WRAP
chmod 755 $D/bin/vscode
'''
