# Zen Browser, from the project's GitHub releases (zen-browser/desktop).
# sha256 the GitHub asset digest of the release, 2026-11-08.

recipe_version = 1

[package]
name         = "zen"
organization = "zen-browser"
version      = "1.24.2"
release      = 1
min_aos      = "0.4.52"
kind         = "app"
summary      = "Zen web browser, built on Firefox"
license      = "MPL-2.0"
homepage     = "https://zen-browser.app/"

[[source]]
url    = "https://github.com/zen-browser/desktop/releases/download/1.24.2b/zen.linux-x86_64.tar.xz"
sha256 = "bcf7e43160ecfe5f29953ed2a984e7a8028a58f2ec0e3114d36bb904d5f5ce80"
strip  = 1

[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[provides]
command = ["zen"]

[sandbox]
home       = "private"
share      = ["Downloads"]
microphone = true

[launcher]
name       = "Zen Browser"
comment    = "Browse the web"
exec       = "bin/zen"
icon       = "zen/browser/chrome/icons/default/default128.png"
categories = ["Network", "WebBrowser"]
mime       = ["x-scheme-handler/http", "x-scheme-handler/https", "text/html"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/zen $D/bin
cp -a $APM_SRC/. $D/zen/
printf 'pref("security.sandbox.content.read_path_whitelist", "/opt/apm/");\n' > $D/zen/defaults/pref/aos.js
install -d $D/zen/distribution
printf '{ "policies": { "DisableAppUpdate": true, "DisableTelemetry": true, "DontCheckDefaultBrowser": true } }\n' > $D/zen/distribution/policies.json
cat > $D/bin/zen <<WRAP
#!/bin/sh
export MOZ_ENABLE_WAYLAND=1
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/zen/zen "\$@"
WRAP
chmod 755 $D/bin/zen
'''
