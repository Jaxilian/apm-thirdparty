# Zed, from zed.dev: the linux x86_64 tarball that
# https://zed.dev/api/releases/stable/latest/zed-linux-x86_64.tar.gz hands
# out, which is the asset of Zed Industries' own GitHub release. Unpacked
# as it is (zed.app: bin/zed, the CLI, starts libexec/zed-editor, which
# finds the few libraries Zed bundles in lib/), with one wrapper. Zed is
# native Wayland and draws with Vulkan; everything else it links (glib,
# ALSA, xkbcommon) is in the AOS core.
#
# Zed updates itself into its install directory; the store is read-only
# and apm updates the package, so the wrapper turns that off the
# documented way (ZED_UPDATE_EXPLANATION, which Zed shows instead of
# updating).
#
# The sha256 is the one GitHub records for the asset in
# zed-industries/zed's v1.23.2 release, checked against the file as
# downloaded on 2026-10-09; `zed --version` printed
# "Zed 1.23.2 c0199504b9cc". GPL-3.0-or-later (the editor; AGPL and
# Apache parts are listed in licenses.md). Fetched from Zed, never
# mirrored.

recipe_version = 1

[package]
name         = "zed"
organization = "zed"
version      = "1.25.3"
release      = 1
kind         = "app"
summary      = "Zed code editor"
license      = "GPL-3.0-or-later"
homepage     = "https://zed.dev/"
# Needs AOS 0.4.12's aos-sandbox (the home in ~/AppData, `:ro` shares,
# --ssh, --no-flatpak-info); an older one would not know them.
min_aos      = "0.4.12"

[[source]]
url    = "https://zed.dev/api/releases/stable/1.25.3/zed-linux-x86_64.tar.gz"
sha256 = "35f9115acd8b4c3bea6ed20f7c9b6ec8f1d2c2dd5a1cc438d552167b5ed4b342"
strip  = 1

# Zed reads the machine's fonts through fontconfig: /usr/share/fonts,
# which on AOS is the aos/fonts package.
[[dependencies]]
name         = "fonts"
organization = "aos"
track        = "*"

[provides]
command = ["zed"]

# Its own folder, ~/AppData/<org>.<name>, is its home: settings,
# extensions and caches stay there. It sees ~/Projects read-write (where
# repositories live; Open Folder on anything else asks once and restarts
# it into the folder) and ~/.gitconfig read-only, plus the SSH keys
# and the installed tools, as for VS Code.
[sandbox]
home = "private"
share = ["Projects", ".gitconfig:ro"]
tools = true
ssh   = true

[launcher]
name       = "Zed"
comment    = "Code at the speed of thought"
exec       = "bin/zed %F"
icon       = "zed/share/icons/hicolor/512x512/apps/zed.png"
categories = ["Development", "IDE", "TextEditor"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/zed $D/bin
cp -a $APM_SRC/. $D/zed/
cat > $D/bin/zed <<WRAP
#!/bin/sh
# Zed as Zed ships it; updates come from apm.
export ZED_UPDATE_EXPLANATION="Zed is updated by apm (Software)."
exec $APM_PREFIX/zed/bin/zed "\$@"
WRAP
chmod 755 $D/bin/zed
'''
