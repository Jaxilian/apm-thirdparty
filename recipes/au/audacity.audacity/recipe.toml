# Audacity, from the Audacity team's GitHub releases: the official
# AppImage of Audacity 4, which apm fetches as it is (an ELF source
# arrives executable, apm v0.1.13) and the recipe extracts with the
# AppImage's own --appimage-extract -- its runtime is static and needs no
# FUSE. Audacity 4 is Qt 6 and draws on Wayland with the Qt Wayland plugin
# it carries, which the wrapper asks for (Qt would try X11 first), with
# X11 as the fallback. Everything else runs as the team built it, through
# the AppImage's AppRun, which sets its own loader path. Sound goes
# through the machine's PipeWire (ALSA and PulseAudio clients both work).
#
# The sha256 is the one in CHECKSUMS.txt beside the release on GitHub
# (and GitHub's own digest of the asset), checked on 2026-10-09.
# GPL-3.0-only. Fetched from the Audacity team, never mirrored.

recipe_version = 1

[package]
name         = "audacity"
organization = "audacity"
version      = "4.0.1"
release      = 1
kind         = "app"
summary      = "Audacity audio editor and recorder"
license      = "GPL-3.0-only"
homepage     = "https://www.audacityteam.org/"

[[source]]
url    = "https://github.com/audacity/audacity/releases/download/Audacity-4.0.1/audacity-linux-4.0.1-x86_64.AppImage"
sha256 = "ca2f04f172124d1f18ac608749854c5d31f04ab266a758c348190c05d9b2087c"

# The AppImage brings its own toolkit but reads the machine's fonts
# through /usr/share/fonts, which on AOS is the aos/fonts package.
[[dependencies]]
name         = "fonts"
organization = "aos"
track        = "*"

[provides]
command = ["audacity"]

# Recordings and projects live wherever the person keeps them: the whole
# home. Audacity records, so it asks for the microphone.
[sandbox]
home       = "full"
microphone = true

[launcher]
name       = "Audacity"
comment    = "Record and edit audio"
exec       = "bin/audacity"
icon       = "audacity/share/icons/hicolor/512x512/apps/audacity4portable.png"
categories = ["AudioVideo", "Audio", "AudioVideoEditing"]
terminal   = false

[build]
prepare = '''
./audacity-linux-4.0.1-x86_64.AppImage --appimage-extract >/dev/null
'''
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/audacity $D/bin
cp -a $APM_SRC/squashfs-root/. $D/audacity/
cat > $D/bin/audacity <<WRAP
#!/bin/sh
# Audacity as the team ships it: AppRun sets its own loader path and
# starts it. Qt picks X11 first when told nothing; Audacity carries the
# Wayland plugin. APPDIR is what the AppImage runtime would set.
export QT_QPA_PLATFORM="\${QT_QPA_PLATFORM:-wayland;xcb}"
export APPDIR=$APM_PREFIX/audacity
exec $APM_PREFIX/audacity/AppRun "\$@"
WRAP
chmod 755 $D/bin/audacity
'''
