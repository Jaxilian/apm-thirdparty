# Lutris, from its GitHub release: the .deb the Lutris team publishes
# (pure Python, architecture all), unpacked (apm reads a .deb since
# v0.1.13) and laid out the way Lutris runs from a source checkout --
# bin/lutris beside the lutris package and share/lutris -- so its own
# launcher finds both without an install step. It runs on Python and the
# GObject bindings of runtime/python, and GTK3 of runtime/gtk3.
#
# Two lines are changed. Lutris imports its web sign-in dialog (GOG,
# Epic, EA, Ubisoft accounts) at startup, and that dialog requires
# WebKitGTK, which AOS does not carry -- it is a browser engine of its
# own. The import is made optional: Lutris starts, installs and runs
# games, and only the sign-in to those stores is unavailable. And a tool
# Lutris looks up and does not find (xrandr) is run as None, which its
# command runner did not expect; it now counts as a failed command (see
# prepare). Nothing else is patched.
#
# Games run on Wine or Proton builds that Lutris downloads into its own
# home (~/AppData/lutris.lutris); those are X11 programs, hence runtime/xwayland.
#
# The tools it runs come with it (release 4, 2026-10-25; docs/apps.md in
# the OS tree): aos/p7zip (7z unpacks its runtime: "Runtime update
# failed: 7z" at every start without it), aos/xrandr (the display list)
# and aos/glxinfo (the installers' GL check), each a package of its own
# whose bin/ aos-sandbox puts on PATH after the session's. vulkaninfo is
# the core's from AOS 0.4.14. Still missing: cabextract (no Buildroot
# package) and unzip; the installers that want them fail.
#
# runtime/compat32 at /lib (lib32 below), as Steam has it: the Wine and
# Proton builds Lutris downloads are multiarch, and a 32-bit prefix or a
# 32-bit Windows game runs a 32-bit wine-preloader that names
# /lib/ld-linux.so.2 and wants a 32-bit libGL and Vulkan ICD. Lutris's own
# runtime brings 32-bit libraries but no 32-bit glibc or Mesa; without
# compat32 such a game dies at exec with "No such file or directory" for
# the loader. 64-bit programs resolve through /lib64 and /usr/lib and
# notice nothing.
#
# GPL-3.0-or-later. Fetched from GitHub, never mirrored.

recipe_version = 1

[package]
name         = "lutris"
organization = "lutris"
version      = "0.5.22"
release      = 4
kind         = "app"
summary      = "Lutris game launcher"
license      = "GPL-3.0-or-later"
homepage     = "https://lutris.net/"
# Needs AOS 0.4.14: its apm (v0.1.29) installs the manifest_version 2
# tool packages below and the sandbox puts their bin/ on PATH; 0.4.12's
# aos-sandbox (the home in ~/AppData, `:ro` shares, --ssh,
# --no-flatpak-info) is older still.
min_aos      = "0.4.14"

[[source]]
url    = "https://github.com/lutris/lutris/releases/download/v0.5.22/lutris_0.5.22_all.deb"
sha256 = "88a350357e0438b423cdf93108f27942de094dc19f973df73839f3b0b0bafaa0"

[[dependencies]]
name         = "python"
organization = "runtime"
track        = "*"

[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[[dependencies]]
name         = "xwayland"
organization = "runtime"
track        = "*"

# The 32-bit glibc and GLX Mesa for its Wine runners (above).
[[dependencies]]
name         = "compat32"
organization = "runtime"
track        = "*"

# The tools it runs (above). "*" until the closures (docs/apps.md) pin
# builds; manifest_version 2 payloads, which apm v0.1.29 (AOS 0.4.14,
# min_aos above) installs.
[[dependencies]]
name         = "p7zip"
organization = "aos"
track        = "*"

[[dependencies]]
name         = "xrandr"
organization = "aos"
track        = "*"

[[dependencies]]
name         = "glxinfo"
organization = "aos"
track        = "*"

[provides]
command = ["lutris"]

# Game libraries live in its own folder (~/AppData/lutris.lutris is its
# home, ~/Games inside it): nothing else of the home. No /.flatpak-info:
# Lutris 0.5.22 takes the file to mean it is the Flatpak build
# (util/linux.py is_flatpak) and then reaches for flatpak-spawn and the
# Flatpak Steam's paths.
[sandbox]
home = "private"
flatpak_info = false
# The 32-bit glibc at /lib for the Wine runners (above).
lib32 = "runtime/compat32"
microphone = true
# A game: the discrete GPU where the laptop has one.
gpu = true

[launcher]
name       = "Lutris"
comment    = "Install and play games from anywhere"
exec       = "bin/lutris"
icon       = "lutris/share/icons/hicolor/scalable/apps/net.lutris.Lutris.svg"
categories = ["Game"]
terminal   = false

[build]
prepare = '''
sed -i '/^try:$/,/^from gi.repository import WebKit2/c\
try:\
    try:\
        gi.require_version("WebKit2", "4.1")\
    except ValueError:\
        gi.require_version("WebKit2", "4.0")\
    from gi.repository import WebKit2  # type: ignore[attr-defined]\
except (ValueError, ImportError):\
    WebKit2 = None  # AOS has no WebKitGTK: the web sign-in dialogs are unavailable' usr/lib/python3/dist-packages/lutris/gui/dialogs/webconnect_dialog.py
grep -q '^    WebKit2 = None' usr/lib/python3/dist-packages/lutris/gui/dialogs/webconnect_dialog.py
# The display list comes from xrandr, which AOS has not (an X11 tool, and
# Wayland lets no program switch the resolution anyway). Lutris looks the
# tool up and passes None where it found nothing; the shared command
# runner treats that like a tool that failed, so the window comes up
# with an empty display list instead of not at all.
sed -i 's/    except (OSError, subprocess.CalledProcessError, subprocess.TimeoutExpired) as ex:/    except (OSError, TypeError, subprocess.CalledProcessError, subprocess.TimeoutExpired) as ex:/' usr/lib/python3/dist-packages/lutris/util/system.py
grep -q 'OSError, TypeError' usr/lib/python3/dist-packages/lutris/util/system.py
'''
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/lutris/bin $D/bin
cp -a $APM_SRC/usr/lib/python3/dist-packages/lutris $D/lutris/lutris
cp -a $APM_SRC/usr/share $D/lutris/share
rm -rf $D/lutris/share/doc $D/lutris/share/man
install -m 755 $APM_SRC/usr/games/lutris $D/lutris/bin/lutris
cat > $D/bin/lutris <<WRAP
#!/bin/sh
# Lutris: Python and its GObject bindings from runtime/python, GTK3 from
# runtime/gtk3 (whose gtk3-run sets the toolkit's paths), on Wayland.
PY=/opt/apm/packages/runtime/python/current
export PATH="\$PY/bin:\$PATH"
export LD_LIBRARY_PATH="\$PY/lib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}"
export GI_TYPELIB_PATH="\$PY/lib/girepository-1.0"
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run \$PY/bin/python3 $APM_PREFIX/lutris/bin/lutris "\$@"
WRAP
chmod 755 $D/bin/lutris
'''
