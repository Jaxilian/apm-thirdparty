# Node.js, the current LTS line (24, "Krypton"), from nodejs.org: the
# official linux-x64 binary tarball, copied into the package as it is
# (bin/ include/ share/), the way the Rust toolchain recipe in
# apm-recipes does it.
#
# node only, for now. npm and npx live in lib/node_modules/npm, and apm
# (v0.1.14) never packs a directory named node_modules at any depth --
# pak.rs EXCLUDED, meant for `apm ship` of a source tree -- so the
# package would carry dangling npm/npx links. They are removed here; when
# apm packs build payloads whole, the next release adds back npm, npx and
# an etc/npmrc with prefix=${HOME}/.local (the store is read-only, so
# `npm install -g` has to go to the home).
#
# No sandbox, like the Rust toolchain: a developer tool works on the
# person's files and runs what they tell it to.
#
# The sha256 is the one in nodejs.org's SHASUMS256.txt for v24.21.0,
# checked against the file as downloaded on 2026-10-09. MIT (Node.js;
# the bundled dependencies' licences are in LICENSE). Fetched from
# nodejs.org, never mirrored.

recipe_version = 1

[package]
name         = "node"
organization = "nodejs"
version      = "24.21.0"
release      = 1
kind         = "bin"
summary      = "Node.js JavaScript runtime"
license      = "MIT"
homepage     = "https://nodejs.org/"

[[source]]
url    = "https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz"
sha256 = "fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6"
strip  = 1

[provides]
command = ["node"]

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D
cp -a $APM_SRC/. $D/
rm -rf $D/lib $D/bin/npm $D/bin/npx $D/bin/corepack
'''
