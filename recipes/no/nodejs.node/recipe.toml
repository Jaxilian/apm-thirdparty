# Node.js, the current LTS line (24, "Krypton"), from nodejs.org: the
# official linux-x64 binary tarball, copied into the package as it is
# (bin/ include/ share/), the way the Rust toolchain recipe in
# apm-recipes does it.
#
# npm and npx come with it (lib/node_modules/npm): they need apm v0.1.15,
# which packs a recipe's payload whole (v0.1.14 dropped every directory
# named node_modules). etc/npmrc sets
# prefix=${HOME}/AppData/nodejs.node/global, since the store is
# read-only: `npm install -g` goes there, and [provides] path puts its
# bin on PATH.
#
# Release 2 (2026-11-12): npm's cache and logs go to
# ~/AppData/nodejs.node/cache (cache= in etc/npmrc), not ~/.npm. Node 26
# ships no corepack: pnpm is pnpm/pnpm, yarn is `npm install -g yarn`.
# [provides] cache lets the sandboxes with the tools write that cache
# (AOS 0.4.75); a cache needs an env beside it, and COREPACK_HOME is the
# one Node has: a corepack installed with npm keeps its package managers
# there.
#
# No sandbox, like the Rust toolchain: a developer tool works on the
# person's files and runs what they tell it to.
#
# The sha256 is the one in nodejs.org's SHASUMS256.txt for v24.21.0,
# checked against the file as downloaded on 2026-10-09. MIT (Node.js;
# the bundled dependencies' licences are in LICENSE). Fetched from
# nodejs.org, never mirrored.

recipe_version = 1

[package]
name         = "node"
organization = "nodejs"
version      = "26.13.1"
release      = 2
kind         = "bin"
summary      = "Node.js JavaScript runtime"
license      = "MIT"
homepage     = "https://nodejs.org/"
min_aos      = "0.4.75"

[[source]]
url    = "https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz"
sha256 = "5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864"
strip  = 1

[provides]
command = ["node", "npm", "npx"]
env     = ["COREPACK_HOME=AppData/nodejs.node/corepack"]
path    = ["AppData/nodejs.node/global/bin"]
cache   = ["cache"]

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D
cp -a $APM_SRC/. $D/
install -d $D/etc
printf 'prefix=${HOME}/AppData/nodejs.node/global\ncache=${HOME}/AppData/nodejs.node/cache\n' > $D/etc/npmrc
'''
