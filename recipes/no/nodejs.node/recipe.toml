# Node.js, the current LTS line (24, "Krypton"), from nodejs.org: the
# official linux-x64 binary tarball, copied into the package as it is
# (bin/ include/ share/), the way the Rust toolchain recipe in
# apm-recipes does it.
#
# npm and npx come with it (lib/node_modules/npm): they need apm v0.1.15,
# which packs a recipe's payload whole (v0.1.14 dropped every directory
# named node_modules). etc/npmrc sets prefix=${HOME}/.local, since the
# store is read-only: `npm install -g` goes to the home, and AOS puts
# ~/.local/bin on PATH.
#
# No sandbox, like the Rust toolchain: a developer tool works on the
# person's files and runs what they tell it to.
#
# The sha256 is the one in nodejs.org's SHASUMS256.txt for v24.21.0,
# checked against the file as downloaded on 2026-10-09. MIT (Node.js;
# the bundled dependencies' licences are in LICENSE). Fetched from
# nodejs.org, never mirrored.

recipe_version = 1

[package]
name         = "node"
organization = "nodejs"
version      = "24.22.1"
release      = 1
kind         = "bin"
summary      = "Node.js JavaScript runtime"
license      = "MIT"
homepage     = "https://nodejs.org/"

[[source]]
url    = "https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz"
sha256 = "6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6"
strip  = 1

[provides]
command = ["node", "npm", "npx"]

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D
cp -a $APM_SRC/. $D/
rm -f $D/bin/corepack
install -d $D/etc
printf 'prefix=${HOME}/.local\n' > $D/etc/npmrc
'''
