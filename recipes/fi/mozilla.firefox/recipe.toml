# Firefox, from Mozilla's own release directory: the same tarball Mozilla
# hands out on its download page, unpacked as it is, with one wrapper that
# runs it through the GTK3 runtime with Wayland turned on. Mozilla
# publishes SHA256SUMS beside every release, so a version bump is two
# text edits. NSS, NSPR and SQLite are Mozilla's own copies inside the
# tarball; GTK3, fontconfig, dbus, ALSA and the X11 libraries Firefox
# still links come from the runtime.
#
# One default preference is added. Firefox's content processes run in
# a sandbox that lets them read fonts only from the directories Firefox
# knows by name (/usr/share/fonts and a few others); it does not read
# fontconfig's configuration to learn more. AOS keeps its fonts and the
# runtime under /opt/apm, so pages rendered as hex boxes while the
# browser's own chrome, drawn by the unsandboxed parent, was fine. The
# read whitelist opens the store to the content processes, read-only.
#
# Mozilla Public License 2.0, with Mozilla's trademarks on the name and
# logo; distributing the unmodified official build is what the trademark
# policy allows. Fetched from Mozilla, never mirrored.

recipe_version = 1

[package]
name         = "firefox"
organization = "mozilla"
version      = "156.0.0"
release      = 4
kind         = "app"
summary      = "Firefox web browser"
license      = "MPL-2.0"
homepage     = "https://www.mozilla.org/firefox/"

[[source]]
url    = "https://download-installer.cdn.mozilla.net/pub/firefox/releases/156.0/linux-x86_64/en-US/firefox-156.0.tar.xz"
sha256 = "1d44cd02351c307c3e19061ea2a4d18a30f236e6be862b94f2282564afdb0167"
strip  = 1

[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[provides]
command = ["firefox"]

# What Firefox sees of the person's files: a home of its own and
# Downloads. Its profile lives in ~/.var/app/mozilla.firefox from this
# release; a profile made by an earlier release stays in ~/.mozilla.
[sandbox]
home  = "private"
share = ["Downloads"]

[launcher]
name       = "Firefox"
comment    = "Browse the web"
exec       = "bin/firefox"
icon       = "firefox/browser/chrome/icons/default/default128.png"
categories = ["Network", "WebBrowser"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/firefox $D/bin
cp -a $APM_SRC/. $D/firefox/
cat > $D/firefox/defaults/pref/aos.js <<PREF
// AOS: the content sandbox may read the package store (fonts, runtime).
pref("security.sandbox.content.read_path_whitelist", "/opt/apm/");
PREF
cat > $D/bin/firefox <<WRAP
#!/bin/sh
# Firefox on the GTK3 runtime, on Wayland. MOZ_ENABLE_WAYLAND is the
# switch; without it GDK would look for an X display and find none.
export MOZ_ENABLE_WAYLAND=1
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/firefox/firefox "\$@"
WRAP
chmod 755 $D/bin/firefox
'''
