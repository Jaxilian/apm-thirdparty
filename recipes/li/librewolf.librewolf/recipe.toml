# LibreWolf, from LibreWolf's own release server, dl.librewolf.net.
# sha256 as listed in LibreWolf's .sha256sum beside the tarball, 2026-11-08.

recipe_version = 1

[package]
name         = "librewolf"
organization = "librewolf"
version      = "159.0.1"
release      = 1
min_aos      = "0.4.52"
kind         = "app"
summary      = "LibreWolf web browser, Firefox without telemetry"
license      = "MPL-2.0"
homepage     = "https://librewolf.net/"

[[source]]
url    = "https://dl.librewolf.net/librewolf/159.0.1-1/librewolf-159.0.1-1-linux-x86_64-package.tar.xz"
sha256 = "692524efc43922eaa3f1ed39a91e6483ad9d794996787ebbb1be3c9c9ca46f87"
strip  = 1

[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[provides]
command = ["librewolf"]

[sandbox]
home       = "private"
share      = ["Downloads"]
microphone = true

[launcher]
name       = "LibreWolf"
comment    = "Browse the web"
exec       = "bin/librewolf"
icon       = "librewolf/browser/chrome/icons/default/default128.png"
categories = ["Network", "WebBrowser"]
mime       = ["x-scheme-handler/http", "x-scheme-handler/https", "text/html"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/librewolf $D/bin
cp -a $APM_SRC/. $D/librewolf/
printf 'pref("security.sandbox.content.read_path_whitelist", "/opt/apm/");\n' > $D/librewolf/defaults/pref/aos.js
cat > $D/bin/librewolf <<WRAP
#!/bin/sh
export MOZ_ENABLE_WAYLAND=1
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/librewolf/librewolf "\$@"
WRAP
chmod 755 $D/bin/librewolf
'''
