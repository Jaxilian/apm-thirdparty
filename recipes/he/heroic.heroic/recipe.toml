# Heroic Games Launcher (Epic, GOG and Amazon games), from the Heroic
# team's own GitHub release: the linux x64 tarball (the unpacked
# Electron application), copied as it is, with one wrapper that runs it
# through the GTK3 runtime with Electron on Wayland. The tarball rather
# than the AppImage: the same files, with nothing to extract.
#
# Games run on Wine or Proton builds Heroic downloads into its own home
# (~/AppData/heroic.heroic); those are X11 programs, hence runtime/xwayland. Heroic does not
# update itself from the tarball; apm updates the package.
#
# The sha256 is the one GitHub records for the asset in
# Heroic-Games-Launcher/HeroicGamesLauncher's v2.22.3 release, checked
# against the file as downloaded on 2026-10-09. GPL-3.0-only. Fetched
# from GitHub, never mirrored.

recipe_version = 1

[package]
name         = "heroic"
organization = "heroic"
version      = "2.22.4"
release      = 2
kind         = "app"
summary      = "Heroic Games Launcher for Epic, GOG and Amazon games"
license      = "GPL-3.0-only"
homepage     = "https://heroicgameslauncher.com/"
# Needs AOS 0.4.12's aos-sandbox (the home in ~/AppData, `:ro` shares,
# --ssh, --no-flatpak-info); an older one would not know them.
min_aos      = "0.4.12"

[[source]]
url    = "https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/releases/download/v2.22.4/Heroic-2.22.4-linux-x64.tar.xz"
sha256 = "81497c4e67d42905da5839a32be053c011eae35fb1fd5ec9441249b238d8f99b"
strip  = 1

[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[[dependencies]]
name         = "xwayland"
organization = "runtime"
track        = "*"

[provides]
command = ["heroic"]

# As Lutris: game libraries (~/Games by default) and the Wine and Proton
# builds it downloads live in its own folder, ~/AppData/heroic.heroic,
# its home; nothing else of the home. Heroic tells the Flatpak build by
# FLATPAK_ID, which aos-sandbox does not set, so /.flatpak-info stays
# (not checked against this payload). The microphone for voice chat in
# games, which Software's Permissions switch off.
[sandbox]
home = "private"
microphone = true
# A game: the discrete GPU where the laptop has one.
gpu = true

[launcher]
name       = "Heroic Games Launcher"
comment    = "Play Epic, GOG and Amazon games"
exec       = "bin/heroic"
icon       = "heroic/resources/app.asar.unpacked/build/icon.png"
categories = ["Game"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/heroic $D/bin
cp -a $APM_SRC/. $D/heroic/
cat > $D/bin/heroic <<WRAP
#!/bin/sh
# Heroic on the GTK3 runtime, on Wayland.
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/heroic/heroic --ozone-platform=wayland "\$@"
WRAP
chmod 755 $D/bin/heroic
'''
