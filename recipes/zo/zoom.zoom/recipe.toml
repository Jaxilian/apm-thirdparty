# Zoom Workplace, from Zoom's own download (cdn.zoom.us, where
# https://zoom.us/client/latest/zoom_amd64.deb redirects): the .deb Zoom
# publishes, unpacked (apm reads a .deb since v0.1.13), with one wrapper.
# The .deb rather than the tar.xz beside it: the same /opt/zoom, plus the
# icon, and Zoom signs the .deb. Zoom carries its own Qt (with the Wayland
# and xcb platform plugins) and its own Chromium Embedded Framework; the X
# libraries, PulseAudio client and fontconfig it links come from the GTK3
# runtime. ZoomLauncher picks the platform itself, as on any Linux.
#
# Zoom links libraries that neither AOS nor the runtime has: the xcb-util
# family its Qt xcb plugin and the client need (cursor, image, keysyms,
# icccm, render-util, util), Kerberos (its Qt Network links
# libgssapi_krb5), libSM/libICE and libgomp. They come from Debian 13's
# archive as further sources, by the exact versions and checksums of
# Debian's own index (Packages.xz, whose hash matches trixie's InRelease
# as fetched on 2026-10-09), and go into lib/ here, which the wrapper
# puts on the loader path.
#
# The version is Zoom's 7.2.1.5760 without the build number, since a
# version here has three parts. Zoom publishes no checksum file; the .deb
# carries a dpkg-sig builder signature (_gpgbuilder), which was checked
# with gpgv against Zoom's key (https://zoom.us/linux/download/pubkey,
# 84C365D6 CC9A4886 CA926BCC 4F219739 9706AC24) together with the sha1
# and md5 it lists for each member, and the sha256 here is of the file as
# downloaded on 2026-10-09.
#
# Proprietary: Zoom Terms of Service. Fetched from Zoom, never mirrored.
# The Debian libraries are MIT/X11 (xcb-util, libSM, libICE, Kerberos),
# LGPL-2+ (keyutils) and GPL-3 with the GCC runtime exception (libgomp),
# unmodified.

recipe_version = 1

[package]
name         = "zoom"
organization = "zoom"
version      = "7.2.1"
release      = 1
kind         = "app"
summary      = "Zoom video meetings"
license      = "LicenseRef-Zoom-Terms-of-Service AND MIT AND X11 AND GPL-3.0-or-later WITH GCC-exception-3.1 AND LGPL-2.0-or-later"
homepage     = "https://zoom.us/"

