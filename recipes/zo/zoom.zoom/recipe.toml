[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

# Zoom draws Wayland or X11 as ZoomLauncher decides; XWayland for the
# latter.
[[dependencies]]
name         = "xwayland"
organization = "runtime"
track        = "*"

[provides]
command = ["zoom"]

# A home of its own (~/.zoom inside it) and Downloads, where recordings
# and files go; the microphone and the camera, which is what Zoom is for,
# and which Software's Permissions switch off.
[sandbox]
home       = "private"
share      = ["Downloads"]
microphone = true
camera     = true

[launcher]
name       = "Zoom"
comment    = "Video meetings"
exec       = "bin/zoom"
icon       = "zoom/Zoom.png"
categories = ["Network", "VideoConference", "AudioVideo"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/zoom $D/lib $D/bin
cp -a $APM_SRC/opt/zoom/. $D/zoom/
for n in $(seq 2 15); do
	eval s=\$APM_SOURCE_$n
	find $s -name '*.so*' -exec cp -a {} $D/lib/ \;
done
install -m 644 $APM_SRC/usr/share/pixmaps/Zoom.png $D/zoom/Zoom.png
cat > $D/bin/zoom <<WRAP
#!/bin/sh
# Zoom with the GTK3 runtime's libraries; its own Qt and CEF, and the
# Debian libraries in lib/.
export LD_LIBRARY_PATH="$APM_PREFIX/lib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}"
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/zoom/ZoomLauncher "\$@"
WRAP
chmod 755 $D/bin/zoom
'''
