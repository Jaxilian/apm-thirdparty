# Ungoogled Chromium, from the project's portable Linux build on GitHub
# (ungoogled-software/ungoogled-chromium-portablelinux).
# sha256: the GitHub asset digest of the release, 2026-11-08.

recipe_version = 1

[package]
name         = "ungoogled-chromium"
organization = "ungoogled-software"
version      = "156.8078.79"
release      = 1
min_aos      = "0.4.52"
kind         = "app"
summary      = "Chromium without Google's services"
license      = "BSD-3-Clause"
homepage     = "https://github.com/ungoogled-software/ungoogled-chromium"

[[source]]
url    = "https://github.com/ungoogled-software/ungoogled-chromium-portablelinux/releases/download/156.0.8078.79-1/ungoogled-chromium-156.0.8078.79-1-x86_64_linux.tar.xz"
sha256 = "d35a9064068274af1a2efa8bcb9b42306e590f9b5c929789f2e0e51a35880499"
strip  = 1

[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[provides]
command = ["ungoogled-chromium"]

[sandbox]
home       = "private"
share      = ["Downloads"]
microphone = true

[launcher]
name       = "Ungoogled Chromium"
comment    = "Browse the web"
exec       = "bin/ungoogled-chromium"
icon       = "ungoogled-chromium/product_logo_48.png"
categories = ["Network", "WebBrowser"]
mime       = ["x-scheme-handler/http", "x-scheme-handler/https", "text/html"]
terminal   = false
app_id     = "chromium-browser"

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/ungoogled-chromium $D/bin
cp -a $APM_SRC/. $D/ungoogled-chromium/
rm -f $D/ungoogled-chromium/libqt5_shim.so $D/ungoogled-chromium/libqt6_shim.so
cat > $D/bin/ungoogled-chromium <<WRAP
#!/bin/sh
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/ungoogled-chromium/chrome --ozone-platform=wayland --password-store=gnome-libsecret "\$@"
WRAP
chmod 755 $D/bin/ungoogled-chromium
'''
