# Unity Hub, from Unity's own apt repository: the .deb Unity publishes,
# unpacked, with one wrapper that runs unityhub (a GPUI program since
# 4.0, like Zed) on Wayland. The Hub installs the Unity editors itself,
# into its home (~/AppData/unity.unityhub/Unity/Hub/Editor), and needs a
# Unity account to do so. Bump from
# https://hub.unity3d.com/linux/repos/deb/dists/stable/main/binary-amd64/Packages
# (Filename and SHA256 of the newest unityhub).
#
# The postinst adds an apt source and an AppArmor profile, neither of
# which applies.
#
# Since 3.22.6 its licensing client carries .NET's LTTng trace provider
# (libcoreclrtraceptprovider.so), which links liblttng-ust, not on AOS:
# removed, as in microsoft/dotnet; .NET runs without it.
#
# Proprietary: Unity Terms of Service. Fetched from Unity, never mirrored.

recipe_version = 1

[package]
name         = "unityhub"
organization = "unity"
version      = "4.0.2"
release      = 1
min_aos      = "0.4.52"
kind         = "app"
summary      = "Unity Hub: installs and opens the Unity game engine"
license      = "LicenseRef-Unity-Terms-of-Service"
homepage     = "https://unity.com/"

[[source]]
url    = "https://hub.unity3d.com/linux/repos/deb/pool/main/u/unity/unityhub_amd64/UnityHubSetup-4.0.2-amd64.deb"
sha256 = "ce784d80cce5117b387c96310d3322327a54d5e6fc4dba1c1874f179d341082c"

[[dependencies]]
name         = "fonts"
organization = "aos"
track        = "*"

[provides]
command = ["unityhub"]

# As Godot: a home of its own (the Hub, the editors it installs, their
# caches) and ~/Projects, where the games are.
[sandbox]
home  = "private"
share = ["Projects"]
# The installed tools (Java, google/android-sdk with its per-person SDK
# root in ~/AppData/google.android-sdk, Gradle): Android export finds the
# one SDK the Terminal and Android Studio use (2026-10-30).
tools = true

[launcher]
name       = "Unity Hub"
comment    = "Install Unity and open your games"
exec       = "bin/unityhub"
mime       = ["x-scheme-handler/unityhub"]
icon       = "unityhub/unityhub.png"
categories = ["Development", "IDE"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/unityhub $D/bin
cp -a $APM_SRC/usr/lib/unityhub/. $D/unityhub/
rm -f $D/unityhub/UnityLicensingClient_V1/libcoreclrtraceptprovider.so
install -m 644 $APM_SRC/usr/share/icons/hicolor/512x512/apps/unityhub.png $D/unityhub/unityhub.png
cat > $D/bin/unityhub <<WRAP
#!/bin/sh
exec $APM_PREFIX/unityhub/unityhub "\$@"
WRAP
chmod 755 $D/bin/unityhub
'''
