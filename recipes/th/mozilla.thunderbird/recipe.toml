# Thunderbird, from Mozilla's own release directory: the same tarball
# thunderbird.net hands out, unpacked as it is, with one wrapper that runs
# it through the GTK3 runtime with Wayland turned on -- the Firefox recipe
# over again. The release channel (157), not ESR (140/153): it is what
# thunderbird.net offers by default, and apm brings each monthly release.
#
# The same content-sandbox preference as Firefox (fonts under /opt/apm),
# and enterprise policies that turn off telemetry and Thunderbird's own
# updater (apm updates the package).
#
# The sha256 is the one in Mozilla's SHA256SUMS for this release, checked
# against the file as downloaded on 2026-10-09. Mozilla Public License
# 2.0, with Mozilla's trademarks on the name and logo; the unmodified
# official build. Fetched from Mozilla, never mirrored.

recipe_version = 1

[package]
name         = "thunderbird"
organization = "mozilla"
version      = "158.0.0"
release      = 1
kind         = "app"
summary      = "Thunderbird mail and calendar"
license      = "MPL-2.0"
homepage     = "https://www.thunderbird.net/"

[[source]]
url    = "https://download-installer.cdn.mozilla.net/pub/thunderbird/releases/158.0/linux-x86_64/en-US/thunderbird-158.0.tar.xz"
sha256 = "6d157e9cfb9314e77fc3f83761fdcb34c4a14f363f64ebc08afa942956421c7f"
strip  = 1

[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[provides]
command = ["thunderbird"]

# Mail, calendars and accounts live in Thunderbird's profile, which
# belongs in a home of its own (~/.var/app/mozilla.thunderbird); the
# person's files it sees are Downloads, where attachments are saved and
# picked from.
[sandbox]
home  = "private"
share = ["Downloads"]

[launcher]
name       = "Thunderbird"
comment    = "Read and write mail"
exec       = "bin/thunderbird"
icon       = "thunderbird/chrome/icons/default/default128.png"
categories = ["Network", "Email"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/thunderbird $D/bin
cp -a $APM_SRC/. $D/thunderbird/
cat > $D/thunderbird/defaults/pref/aos.js <<PREF
// AOS: the content sandbox may read the package store (fonts, runtime).
pref("security.sandbox.content.read_path_whitelist", "/opt/apm/");
PREF
install -d $D/thunderbird/distribution
cat > $D/thunderbird/distribution/policies.json <<POL
{ "policies": {
    "DisableTelemetry": true,
    "DisableAppUpdate": true
} }
POL
cat > $D/bin/thunderbird <<WRAP
#!/bin/sh
# Thunderbird on the GTK3 runtime, on Wayland.
export MOZ_ENABLE_WAYLAND=1
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/thunderbird/thunderbird "\$@"
WRAP
chmod 755 $D/bin/thunderbird
'''
