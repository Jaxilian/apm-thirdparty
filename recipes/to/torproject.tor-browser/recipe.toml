# Tor Browser, from the Tor Project's archive.torproject.org, which keeps
# every release (dist.torproject.org drops a release when the next is out).
# sha256 as listed in the release's sha256sums-signed-build.txt, 2026-11-12.

recipe_version = 1

[package]
name         = "tor-browser"
organization = "torproject"
version      = "16.0.1"
release      = 1
min_aos      = "0.4.52"
kind         = "app"
summary      = "Tor Browser, browse through the Tor network"
license      = "MPL-2.0 AND BSD-3-Clause AND LicenseRef-Tor-Trademark"
homepage     = "https://www.torproject.org/"

[[source]]
url    = "https://archive.torproject.org/tor-package-archive/torbrowser/16.0.1/tor-browser-linux-x86_64-16.0.1.tar.xz"
sha256 = "5b36ad610c20c81faa72caf27d1cd3a11f14a327c320b4cec581400016ba78b0"
strip  = 1

[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[provides]
command = ["tor-browser"]

[sandbox]
home  = "private"
share = ["Downloads"]

[launcher]
name       = "Tor Browser"
comment    = "Browse the web privately"
exec       = "bin/tor-browser"
icon       = "tor-browser/Browser/browser/chrome/icons/default/default128.png"
categories = ["Network", "WebBrowser"]
terminal   = false
app_id     = "Tor Browser"

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/tor-browser $D/bin
cp -a $APM_SRC/. $D/tor-browser/
touch $D/tor-browser/Browser/is-packaged-app
install -d $D/tor-browser/Browser/distribution
printf '{ "policies": { "DisableAppUpdate": true } }\n' > $D/tor-browser/Browser/distribution/policies.json
cat > $D/bin/tor-browser <<WRAP
#!/bin/sh
mkdir -p "\$HOME/.tor-browser"
[ -e "\$HOME/.tor-browser/Downloads" ] || ln -s "\$HOME/Downloads" "\$HOME/.tor-browser/Downloads"
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/tor-browser/Browser/start-tor-browser "\$@"
WRAP
chmod 755 $D/bin/tor-browser
'''
