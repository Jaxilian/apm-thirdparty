# JetBrains Toolbox, from JetBrains' own download server: the linux
# tarball that https://data.services.jetbrains.com/products/releases?code=TBA
# names, unpacked, with one wrapper. Toolbox is a JVM program with its own
# runtime (bin/jre) and draws through X11, so it runs on XWayland with the
# X client libraries of the GTK3 runtime.
#
# What this package holds is, like Discord's, a bootstrap: at first start
# Toolbox copies itself into ~/.local/share/JetBrains/Toolbox, runs from
# there and updates itself there, and installs the IDEs (IntelliJ IDEA,
# PyCharm, ...) into the home as well, with launchers in
# ~/.local/share/applications. That is JetBrains' own model; apm updates
# only this bootstrap. Its home is its own folder in ~/AppData, so all of
# that lands there (the IDEs' launchers do not reach the menu); the IDEs
# work on projects in ~/Projects and need the network.
#
# The version is JetBrains' 3.8.1.88030 without the build number, since a
# version here has three parts. The sha256 is the one in JetBrains'
# .sha256 file beside the tarball, checked against the file as downloaded
# on 2026-10-09.
#
# Proprietary: JetBrains Toolbox App licence (free of charge). Fetched
# from JetBrains, never mirrored.

recipe_version = 1

[package]
name         = "toolbox"
organization = "jetbrains"
version      = "3.9.0"
release      = 2
kind         = "app"
summary      = "JetBrains Toolbox: installs and updates JetBrains IDEs"
license      = "LicenseRef-JetBrains-Toolbox-App"
homepage     = "https://www.jetbrains.com/toolbox-app/"
# Needs AOS 0.4.12's aos-sandbox (the home in ~/AppData, `:ro` shares,
# --ssh, --no-flatpak-info); an older one would not know them.
min_aos      = "0.4.12"

[[source]]
url    = "https://download.jetbrains.com/toolbox/jetbrains-toolbox-3.9.0.88839.tar.gz"
sha256 = "e578d49627da13a6e196e234bfb6325db02a64a07fd22414909daae378ab4049"
strip  = 1

[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[[dependencies]]
name         = "xwayland"
organization = "runtime"
track        = "*"

[provides]
command = ["jetbrains-toolbox"]

# The IDEs it installs land in its own folder (~/AppData/<org>.<name>
# is their home) and open projects from ~/Projects, read-write;
# ~/.gitconfig read-only, the SSH keys (read-only, the agent's socket) for
# git over ssh, the installed tools, the network on (the default).
[sandbox]
home = "private"
share = ["Projects", ".gitconfig:ro"]
tools = true
ssh   = true

[launcher]
name       = "JetBrains Toolbox"
comment    = "Install and update JetBrains IDEs"
exec       = "bin/jetbrains-toolbox"
icon       = "toolbox/bin/toolbox.svg"
categories = ["Development"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/toolbox $D/bin
cp -a $APM_SRC/. $D/toolbox/
cat > $D/bin/jetbrains-toolbox <<WRAP
#!/bin/sh
# JetBrains Toolbox with the GTK3 runtime's X libraries, on XWayland.
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/toolbox/bin/jetbrains-toolbox "\$@"
WRAP
chmod 755 $D/bin/jetbrains-toolbox
'''
