# Python: CPython 3.13 from python-build-standalone (astral-sh on GitHub),
# the relocatable "install_only" build for x86_64 Linux, copied into the
# package as it is (bin/ lib/ include/ share/). AOS has no system Python
# (runtime/python is Lutris's, with no commands of its own); this is the
# person's python3 and pip3.
#
# The store is read-only, so pip installs into ~/.local by itself
# ("normal site-packages is not writeable"); a venv works as anywhere.
# pip's scripts find their interpreter from their own real path.
#
# Release 2 (2026-11-01): a sitecustomize.py that puts every installed
# package's lib/python3/site-packages on sys.path, the system store's and
# ~/AppData/aos.apm's, so a Python library is a package in Software (pypi/kconfiglib
# is the first) and nothing need go to ~/.local.
#
# No sandbox, like the Rust toolchain: a developer tool.
#
# The sha256 is the one in the release's SHA256SUMS (and GitHub's asset
# digest) for this file, checked against it as downloaded on 2026-10-09.
# PSF-2.0 (CPython; the bundled libraries' licences are under
# share/). Fetched from GitHub, never mirrored.

recipe_version = 1

[package]
name         = "python"
organization = "astral"
version      = "3.13.18"
release      = 2
kind         = "bin"
summary      = "Python 3.13"
license      = "PSF-2.0"
homepage     = "https://github.com/astral-sh/python-build-standalone"

[[source]]
url    = "https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.13.18%2B20261026-x86_64-unknown-linux-gnu-install_only.tar.gz"
sha256 = "126343c54daff4068efc1ac269518d0cc202d57857794948103dd1454e8881be"
strip  = 1

[provides]
command = ["python3", "pip3"]

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D
cp -a $APM_SRC/. $D/
cat > $D/lib/python3.13/site-packages/sitecustomize.py <<'PY'
# AOS: every package in Software that carries Python modules keeps them
# in its own lib/python3/site-packages (pypi/kconfiglib and the like);
# the system store's first, then the person's ~/AppData/aos.apm. Nothing in ~/.local.
import glob
import os
import site

_home = os.path.expanduser("~")
for _root in ("/opt/apm/packages", os.path.join(_home, "AppData", "aos.apm", "packages")):
    for _dir in sorted(glob.glob(os.path.join(_root, "*", "*", "current", "lib", "python3", "site-packages"))):
        site.addsitedir(_dir)
PY
'''
