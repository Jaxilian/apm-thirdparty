# Kdenlive, from KDE's download server: the official AppImage, which apm
# fetches as it is (an ELF source arrives executable, apm v0.1.13) and the
# recipe extracts with the AppImage's own --appimage-extract -- its
# runtime is static and needs no FUSE. Kdenlive is Qt 6 and draws on
# Wayland with the Qt Wayland plugin it carries, which the wrapper asks
# for (Qt would try X11 first), with X11 as the fallback. The AppImage
# carries MLT, FFmpeg, frei0r and the rest of the render chain; it leaves
# only the graphics drivers, the sound server and the fonts to the
# machine. It runs through the AppImage's AppRun, as KDE built it.
#
# The wrapper sets FONTCONFIG_FILE, since the bundled fontconfig has a
# build machine's path compiled in (as for Krita); the machine's
# configuration reads /usr/share/fonts, the aos/fonts package.
#
# The version is KDE Gear's 26.08.1 without the leading zero, since a
# version here is semver. The sha256 is the one KDE's download server
# publishes for the file (download.kde.org/...AppImage.sha256), checked
# on 2026-10-09; the URL is KDE's own, which redirects to a mirror KDE
# chooses. GPL-3.0-or-later. Fetched from KDE, never mirrored.

recipe_version = 1

[package]
name         = "kdenlive"
organization = "kde"
version      = "26.8.1"
release      = 1
kind         = "app"
summary      = "Kdenlive video editor"
license      = "GPL-3.0-or-later"
homepage     = "https://kdenlive.org/"

[[source]]
url    = "https://download.kde.org/stable/kdenlive/26.08/linux/kdenlive-26.08.1-x86_64.AppImage"
sha256 = "354570ab360fcc4e6ef2825754489a2f24ba73068ecd5b9dc911c72df20a25de"

# The AppImage brings its own toolkit but reads the machine's fonts
# through /usr/share/fonts, which on AOS is the aos/fonts package.
[[dependencies]]
name         = "fonts"
organization = "aos"
track        = "*"

[provides]
command = ["kdenlive"]

# Footage and projects live wherever the person keeps them: the whole
# home.
[sandbox]
home = "full"

[launcher]
name       = "Kdenlive"
comment    = "Video editor"
exec       = "bin/kdenlive"
icon       = "kdenlive/kdenlive.svg"
categories = ["AudioVideo", "Video", "AudioVideoEditing"]
terminal   = false

[build]
prepare = '''
./kdenlive-26.08.1-x86_64.AppImage --appimage-extract >/dev/null
'''
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/kdenlive $D/bin
cp -a $APM_SRC/squashfs-root/. $D/kdenlive/
cat > $D/bin/kdenlive <<WRAP
#!/bin/sh
# Kdenlive as KDE ships it: AppRun sets MLT's paths and starts it. Qt
# picks X11 first when told nothing; Kdenlive carries the Wayland plugin.
# What the AppImage runtime would set: APPDIR; and the machine's
# fontconfig configuration, which reads /usr/share/fonts (aos/fonts).
export QT_QPA_PLATFORM="\${QT_QPA_PLATFORM:-wayland;xcb}"
export APPDIR=$APM_PREFIX/kdenlive
export FONTCONFIG_FILE=/etc/fonts/fonts.conf
exec $APM_PREFIX/kdenlive/AppRun "\$@"
WRAP
chmod 755 $D/bin/kdenlive
'''
