# Godot Engine with C#: the official ".NET" (mono) Linux x86_64 editor
# from the project's GitHub release, the binary beside its GodotSharp
# assemblies, which it finds next to itself. Building and running C#
# needs the .NET SDK: microsoft/dotnet from this index is a dependency,
# and the wrapper points DOTNET_ROOT at it (the hosting library looks
# there, or for a real `dotnet` on PATH, and the SDK package's is a
# script) with the same invariant-globalization setting that package
# uses (AOS has no libicu). Otherwise as godotengine/godot: the Wayland
# driver, Mesa or NVIDIA, the GTK3 runtime for libpulse and X11, the
# icon from Godot's repository at the release's tag.
#
# The release carries SHA512-SUMS.txt (the bump checks against it); the
# zip's sha256 here is of the file that matched. MIT, with the licences
# of its third-party parts in COPYRIGHT.txt. Fetched from GitHub,
# unmodified.

recipe_version = 1

[package]
name         = "godot-dotnet"
organization = "godotengine"
version      = "4.7.2"
release      = 1
kind         = "app"
summary      = "Godot Engine with C# (.NET), the 2D and 3D game engine and editor"
license      = "MIT"
homepage     = "https://godotengine.org/"
# Needs AOS 0.4.17's apm (an SVG source copied as a file) and its
# aos-sandbox (the home in ~/AppData, shares).
min_aos      = "0.4.17"

[[source]]
url    = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
sha256 = "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247"
strip  = 1

[[source]]
url    = "https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/misc/logo/icon.svg"
sha256 = "1443ae974842b81765d5b50e6a729ebbf41eba2e9e515ab0919f2ea5c8b8f475"

[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[[dependencies]]
name         = "dotnet"
organization = "microsoft"
track        = "*"

[provides]
command = ["godot-dotnet"]

# Its own folder for the editor's settings, export templates, cache and
# the NuGet packages .NET fetches; ~/Projects and ~/Documents read-write
# for the games. Godot has its own file browser, so it sees nothing else
# of the home.
[sandbox]
home = "private"
share = ["Projects", "Documents"]

[launcher]
name       = "Godot Engine (.NET)"
comment    = "Multi-platform 2D and 3D game engine with a feature-rich editor, with C#"
exec       = "bin/godot-dotnet"
icon       = "godot/icon.svg"
categories = ["Development", "IDE"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/godot $D/bin
cp -a $APM_SRC/GodotSharp $D/godot/
install -m 755 $APM_SRC/Godot_v4.7.2-stable_mono_linux.x86_64 $D/godot/godot
install -m 644 $APM_SOURCE_2/icon.svg $D/godot/icon.svg
cat > $D/bin/godot-dotnet <<WRAP
#!/bin/sh
# Godot with C# on its Wayland driver: the .NET SDK from microsoft/dotnet
# through DOTNET_ROOT, libpulse and the X libraries from the GTK3 runtime.
export DOTNET_ROOT=/opt/apm/packages/microsoft/dotnet/current/dotnet
export DOTNET_CLI_TELEMETRY_OPTOUT=1
export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/godot/godot --display-driver wayland "\$@"
WRAP
chmod 755 $D/bin/godot-dotnet
'''
