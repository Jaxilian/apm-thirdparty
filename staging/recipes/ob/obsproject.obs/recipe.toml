[[dependencies]]
name         = "gtk3"
organization = "runtime"
track        = "*"

[[dependencies]]
name         = "fonts"
organization = "aos"
track        = "*"

[provides]
command = ["obs"]

[sandbox]
media      = true
home       = "private"
share      = ["Videos", "Music", "Pictures"]
camera     = true
microphone = true

[launcher]
name       = "OBS Studio"
comment    = "Record the screen and stream live"
exec       = "bin/obs"
app_id     = "com.obsproject.Studio"
icon       = "obs/share/icons/hicolor/256x256/apps/com.obsproject.Studio.png"
categories = ["AudioVideo", "Recorder"]
terminal   = false

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
L=$D/obs/lib/x86_64-linux-gnu
install -d $D/obs $D/bin
cp -a $APM_SRC/usr/local/. $D/obs/
for n in $(seq 2 48); do
	eval s=\$APM_SOURCE_$n
	cp -a $s/usr/lib/x86_64-linux-gnu/. $L/
done
rm -rf $D/obs/include $L/cmake $L/pkgconfig
Q=$L/qt6/plugins
rm -rf $Q/generic $Q/xcbglintegrations $Q/egldeviceintegrations
rm -f $Q/platforms/libqeglfs.so $Q/platforms/libqlinuxfb.so $Q/platforms/libqvkkhrdisplay.so $Q/platforms/libqxcb.so
rm -f $L/libQt6EglFS* $L/libQt6EglFs* $L/libQt6XcbQpa*
mv $L/libproxy/libpxbackend-1.0.so $L/
rmdir $L/libproxy
cd $Q/wayland-graphics-integration-client
rm -f libvulkan-server.so libdmabuf-server.so libdrm-egl-server.so libshm-emulation-server.so
cat > $D/bin/obs <<WRAP
#!/bin/sh
export LD_LIBRARY_PATH="$APM_PREFIX/obs/lib/x86_64-linux-gnu\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}"
export QT_PLUGIN_PATH=$APM_PREFIX/obs/lib/x86_64-linux-gnu/qt6/plugins
export QT_QPA_PLATFORM="\${QT_QPA_PLATFORM:-wayland}"
exec /opt/apm/packages/runtime/gtk3/current/bin/gtk3-run $APM_PREFIX/obs/bin/obs "\$@"
WRAP
chmod 755 $D/bin/obs
'''
