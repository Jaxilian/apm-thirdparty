# OBS Studio, from the OBS Project's own GitHub release
# (obsproject/obs-studio): the .deb it builds for Ubuntu 26.04, unpacked,
# nothing compiled. That build links Ubuntu 26.04's libraries, and AOS
# has no Qt, so the ones the core and runtime/gtk3 lack ride along, each
# the .deb of Ubuntu's own archive (archive.ubuntu.com, resolute and
# resolute-updates): Qt 6.10 (base, SVG, the Wayland client and its
# xdg-shell plugin, the portal platform theme), ICU, PCRE2, libproxy and
# the libcurl-gnutls it wants with that one's own needs (nghttp2, idn2,
# rtmp, ldap, sasl, ssh2, psl, Kerberos), mbedTLS, LuaJIT, x264, SRT,
# RIST, libvpl, v4l, speexdsp and qrcodegen. FFmpeg, Python, PipeWire
# and the GL libraries are the core's; PulseAudio, NSS and ALSA are the
# runtime's.
#
# Wayland only: Qt's xcb, eglfs, linuxfb and VNC platforms and the
# evdev/tslib input plugins are left out with the libraries only they
# need. OBS finds its modules and data from the binary's path
# (../lib/x86_64-linux-gnu/obs-modules, ../share/obs), so the tree keeps
# upstream's shape under obs/.
#
# The sha256 of the OBS .deb is GitHub's digest of the release asset,
# checked against the file as downloaded on 2026-11-14; each Ubuntu
# .deb's is the SHA256 of the archive's Packages index, checked the same
# way. GPL-2.0-or-later, as OBS Studio is; the libraries keep their own
# licences (Qt LGPL-3.0-only, x264 GPL-2.0-or-later). Fetched from the
# OBS Project and from Ubuntu, never mirrored.

recipe_version = 1

[package]
name         = "obs"
organization = "obsproject"
version      = "33.0.1"
release      = 1
min_aos      = "0.4.76"
kind         = "app"
summary      = "OBS Studio: screen recording and live streaming"
license      = "GPL-2.0-or-later"
homepage     = "https://obsproject.com/"

